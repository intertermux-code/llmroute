[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llmroute"
version = "0.1.0"
description = "Benchmark-driven router for OpenAI-compatible LLM endpoints"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AP", email = "intertermux@gmail.com" }]
keywords = ["llm", "router", "openai", "benchmark", "gateway", "failover"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/intertermux-code/llmroute"
Issues = "https://github.com/intertermux-code/llmroute/issues"

[project.scripts]
llmroute = "llmroute:main"

[tool.setuptools.packages.find]
where = ["src"]
